name: Phase 2 Provider Provenance Trust Boundary Validation

on:
  push:
    branches:
      - fix/phase2-provider-provenance-trust-boundary
  pull_request:
    branches:
      - fix/phase2-strict-pit-financial-strength

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Full regression suite
        run: npm test
      - name: Enforce dependency audit
        run: npm audit --audit-level=low
