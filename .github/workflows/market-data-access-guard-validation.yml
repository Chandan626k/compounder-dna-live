name: Mainline Market Data Access Guard Validation

on:
  push:
    branches:
      - 'fix/mainline-market-data-access-fail-closed-*'
    paths:
      - 'api/**'
      - 'lib/market-data-access-policy.js'
      - 'server.js'
      - 'tests/actionability.unit.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/market-data-access-guard-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run full test and syntax suite
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=low
