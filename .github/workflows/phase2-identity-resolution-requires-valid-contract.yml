name: Phase 2 Identity Resolution Requires Valid Contract
on:
  push:
    branches:
      - fix/phase2-identity-resolution-requires-valid-contract
  pull_request:
    branches:
      - fix/phase2-financial-period-date-integrity

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Focused identity resolution regressions
        run: node tests/data-foundation-identity-pit.unit.mjs
      - name: Full regression suite
        run: npm test
      - name: Enforce dependency audit
        run: npm audit --audit-level=low
