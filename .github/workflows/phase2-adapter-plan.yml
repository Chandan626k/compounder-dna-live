name: Phase 2 Adapter Plan

on:
  push:
    branches:
      - remediation/verified-data-contract

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate planner syntax
        run: node --check scripts/phase2-technical-adapter-plan.mjs
      - name: Generate candidate
        run: node scripts/phase2-technical-adapter-plan.mjs
      - name: Validate candidate syntax
        run: node --check /tmp/market-engine.candidate.js
      - name: Apply inspected candidate
        run: cp /tmp/market-engine.candidate.js lib/market-engine.js
      - name: Validate applied diff
        run: |
          git diff --check
          git diff -- lib/market-engine.js
      - name: Commit inspected adapter migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/market-engine.js
          git diff --cached --check
          git commit -m 'refactor: route market-engine technical through canonical adapter'
          git push origin HEAD:remediation/verified-data-contract
