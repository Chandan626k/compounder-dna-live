name: QUODD preview Node 24 parity

on:
  push:
    branches:
      - fix/quodd-preview-node24-runtime-parity

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository regression suite
        run: npm test
      - name: Audit dependencies (run even if tests fail)
        if: always()
        run: npm audit --audit-level=low
