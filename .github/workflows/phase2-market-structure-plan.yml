name: Phase 2 Market Structure Plan

on:
  push:
    branches:
      - remediation/verified-data-contract

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate planner syntax
        run: node --check scripts/phase2-market-structure-plan.mjs
      - name: Generate candidate
        run: node scripts/phase2-market-structure-plan.mjs
      - name: Validate candidate syntax
        run: node --check /tmp/canonical-technical-engine.structure-candidate.js
      - name: Apply inspected candidate
        run: cp /tmp/canonical-technical-engine.structure-candidate.js lib/canonical-technical-engine.js
      - name: Validate applied diff
        run: |
          git diff --check
          git diff -- lib/canonical-technical-engine.js
      - name: Commit inspected market structure migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/canonical-technical-engine.js
          git diff --cached --check
          git commit -m 'refactor: use confirmed-pivot canonical market structure'
          git push origin HEAD:remediation/verified-data-contract
