name: Phase 2 Readiness Runtime Fix Validation

on:
  push:
    branches:
      - fix/phase2-readiness-classic-script-runtime
  pull_request:
    branches:
      - fix/phase2-partial-analysis-security

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Full regression suite
        run: npm test
      - name: Enforce dependency audit
        run: npm audit --audit-level=low
