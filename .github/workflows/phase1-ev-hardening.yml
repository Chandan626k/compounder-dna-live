name: Phase 1 EV hardening runner

on:
  push:
    branches: [phase1-provider-monetary-semantics]
    paths: ['.github/workflows/phase1-ev-hardening.yml']

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-provider-monetary-semantics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch implementation and tests
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('lib/market-engine.js'); s=p.read_text()
          anchor="function value(obj, key) {\n  return num(obj?.[key]);\n}\n"
          helper="""
function assessProviderMonetarySemantics(raw, statementEvidence) {
  const price = raw?.summary?.price || {};
  const tradingCurrency = statementEvidence?.currency?.tradingCurrency || price.currency || null;
  const financialCurrency = statementEvidence?.currency?.financialCurrency || price.financialCurrency || null;
  const currencyStatus = tradingCurrency && financialCurrency ? (tradingCurrency === financialCurrency ? 'MATCH' : 'MISMATCH') : 'UNKNOWN';
  const snapshotSeconds = num(price.regularMarketTime);
  const observationAt = snapshotSeconds != null ? new Date(snapshotSeconds * 1000).toISOString() : null;
  const ttmRows = (raw?.trailing || []).filter((r) => String(r?.periodType || '').toUpperCase() === 'TTM');
  const latestTtm = (key) => { const rows=ttmRows.filter(r => num(r?.[key]) != null && r?.date); return rows.length ? rows.at(-1) : null; };
  const ebitdaRow=latestTtm('EBITDA'), revenueRow=latestTtm('totalRevenue');
  const ebitdaCurrency=ebitdaRow?.currencyCode || ebitdaRow?.currency || financialCurrency || null;
  const revenueCurrency=revenueRow?.currencyCode || revenueRow?.currency || financialCurrency || null;
  const ebitdaPeriod=ebitdaRow?.date || null, revenuePeriod=revenueRow?.date || null;
  const currencyCompatible=currencyStatus==='MATCH' && ebitdaCurrency===financialCurrency && revenueCurrency===financialCurrency;
  const observationEstablished=observationAt != null;
  const ebitdaPeriodEstablished=ebitdaPeriod != null && ebitdaRow?.periodType==='TTM';
  const revenuePeriodEstablished=revenuePeriod != null && revenueRow?.periodType==='TTM';
  const provenanceEstablished=Boolean(raw?.summary?.defaultKeyStatistics) && Boolean(raw?.summary?.financialData || raw?.trailing?.length);
  const ratioCompatible=currencyCompatible && observationEstablished && ebitdaPeriodEstablished && revenuePeriodEstablished && provenanceEstablished;
  const evCompatible=currencyStatus==='MATCH' && observationEstablished && provenanceEstablished;
  const blockedReason=!currencyCompatible || !observationEstablished || !ebitdaPeriodEstablished || !revenuePeriodEstablished || !provenanceEstablished ? 'CURRENCY_OR_PERIOD_SEMANTICS_UNVERIFIED' : null;
  return {source:'Yahoo Finance quoteSummary.defaultKeyStatistics + quoteSummary.price + fundamentalsTimeSeries',tradingCurrency,financialCurrency,currencyStatus,evCurrencyBasis:financialCurrency,observationAt,ebitda:{source:'Yahoo Finance fundamentalsTimeSeries',currency:ebitdaCurrency,period:ebitdaPeriod,periodType:ebitdaRow?.periodType||null},revenue:{source:'Yahoo Finance fundamentalsTimeSeries',currency:revenueCurrency,period:revenuePeriod,periodType:revenueRow?.periodType||null},enterpriseValue:{evidenceStatus:evCompatible?'PROVIDER':'NOT_AVAILABLE',verification:'UNKNOWN',reason:evCompatible?null:blockedReason},evToEbitda:{evidenceStatus:ratioCompatible?'PROVIDER':'NOT_AVAILABLE',verification:'UNKNOWN',reason:ratioCompatible?null:blockedReason},evToRevenue:{evidenceStatus:ratioCompatible?'PROVIDER':'NOT_AVAILABLE',verification:'UNKNOWN',reason:ratioCompatible?null:blockedReason},compatible:{enterpriseValue:evCompatible,evToEbitda:ratioCompatible,evToRevenue:ratioCompatible},provenanceEstablished};
}
"""
          if 'function assessProviderMonetarySemantics(' not in s: s=s.replace(anchor,anchor+helper,1)
          s=s.replace('function buildValuation(raw, price) {','function buildValuation(raw, price, statementEvidence = null) {',1)
          old="  const enterpriseValue = value(k, 'enterpriseValue');\n  const evToEbitda = value(k, 'enterpriseToEbitda');\n  const evToRevenue = value(k, 'enterpriseToRevenue');"
          new="  const providerMonetarySemantics = assessProviderMonetarySemantics(raw, statementEvidence);\n  const rawEnterpriseValue = value(k, 'enterpriseValue');\n  const rawEvToEbitda = value(k, 'enterpriseToEbitda');\n  const rawEvToRevenue = value(k, 'enterpriseToRevenue');\n  const enterpriseValue = providerMonetarySemantics.compatible.enterpriseValue ? rawEnterpriseValue : null;\n  const evToEbitda = providerMonetarySemantics.compatible.evToEbitda ? rawEvToEbitda : null;\n  const evToRevenue = providerMonetarySemantics.compatible.evToRevenue ? rawEvToRevenue : null;"
          s=s.replace(old,new,1)
          s=s.replace('    enterpriseValue,\n    evToEbitda,\n    evToRevenue,','    enterpriseValue,\n    evToEbitda,\n    evToRevenue,\n    providerMonetarySemantics,',1)
          s=s.replace('const valuation = buildValuation(raw, market.price);','const valuation = buildValuation(raw, market.price, statementEvidence);',1)
          oldexp='export { atr, rsi, normalizeDebtToEquity, technical, buildFinancials, buildValuation, buildDataQuality, scoreStock, decision, SCORE_MODEL, buildSectorFramework, classifySector };'
          newexp='export { atr, rsi, normalizeDebtToEquity, technical, buildFinancials, buildValuation, buildDataQuality, scoreStock, decision, SCORE_MODEL, buildSectorFramework, classifySector, assessProviderMonetarySemantics };'
          s=s.replace(oldexp,newexp,1); p.write_text(s)
          t=Path('tests/market-engine.unit.mjs'); ts=t.read_text(); ts=ts.replace('  buildValuation,\n','  buildValuation,\n  assessProviderMonetarySemantics,\n',1); marker="console.log('market-engine.unit: PASS');"
          tests="""

// Phase 1: provider monetary semantics for EV / EV-EBITDA / EV-Revenue.
const compatibleProviderFixture={summary:{price:{currency:'INR',financialCurrency:'INR',regularMarketTime:1750000000},financialData:{ebitda:500},defaultKeyStatistics:{enterpriseValue:5000,enterpriseToEbitda:10,enterpriseToRevenue:2}},trailing:[{date:'2025-03-31T00:00:00.000Z',periodType:'TTM',TYPE:'FINANCIALS',currencyCode:'INR',EBITDA:500,totalRevenue:2500}],annual:[]};
const compatibleSemantics=assessProviderMonetarySemantics(compatibleProviderFixture,{currency:{tradingCurrency:'INR',financialCurrency:'INR',status:'MATCH'}});
assert.equal(compatibleSemantics.compatible.enterpriseValue,true); assert.equal(compatibleSemantics.compatible.evToEbitda,true); assert.equal(compatibleSemantics.compatible.evToRevenue,true); assert.equal(compatibleSemantics.ebitda.periodType,'TTM');
for(const [name,mutate] of [['unknown currency',x=>{x.summary.price.currency=null;x.summary.price.financialCurrency=null;}],['mismatched currency',x=>{x.summary.price.financialCurrency='USD';}],['missing observation',x=>{delete x.summary.price.regularMarketTime;}],['missing provenance',x=>{delete x.summary.defaultKeyStatistics;}],['incompatible periods',x=>{x.trailing[0].periodType='12M';}],['incompatible EBITDA currency',x=>{x.trailing[0].currencyCode='USD';}]]){const f=structuredClone(compatibleProviderFixture);mutate(f);const sem=assessProviderMonetarySemantics(f,{currency:{tradingCurrency:'INR',financialCurrency:f.summary.price.financialCurrency,status:f.summary.price.currency&&f.summary.price.financialCurrency===f.summary.price.currency?'MATCH':'UNKNOWN'}});assert.equal(sem.compatible.enterpriseValue,false,`${name}: EV blocked`);assert.equal(sem.compatible.evToEbitda,false,`${name}: EV/EBITDA blocked`);assert.equal(sem.compatible.evToRevenue,false,`${name}: EV/Revenue blocked`);}
const blockedValuation=buildValuation({...compatibleProviderFixture,summary:{...compatibleProviderFixture.summary,price:{currency:'INR',financialCurrency:'USD',regularMarketTime:1750000000}}},1000,{currency:{tradingCurrency:'INR',financialCurrency:'USD',status:'MISMATCH'}});
assert.equal(blockedValuation.enterpriseValue,null);assert.equal(blockedValuation.evToEbitda,null);assert.equal(blockedValuation.evToRevenue,null);assert.equal(blockedValuation.providerMonetarySemantics.enterpriseValue.reason,'CURRENCY_OR_PERIOD_SEMANTICS_UNVERIFIED');
const allowedValuation=buildValuation(compatibleProviderFixture,1000,{currency:{tradingCurrency:'INR',financialCurrency:'INR',status:'MATCH'}});assert.equal(allowedValuation.enterpriseValue,5000);assert.equal(allowedValuation.evToEbitda,10);assert.equal(allowedValuation.evToRevenue,2);assert.equal(blockedValuation.fairValue,allowedValuation.fairValue);
"""
          if 'Phase 1: provider monetary semantics' not in ts: ts=ts.replace(marker,tests+marker,1)
          t.write_text(ts)
          PY
      - name: Full regression
        run: npm test
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/market-engine.js tests/market-engine.unit.mjs
          git diff --cached --check
          git commit -m 'fix: gate provider EV monetary semantics'
          git push origin phase1-provider-monetary-semantics
