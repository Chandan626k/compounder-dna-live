name: One-Time Period Qualification Remediation

on:
  push:
    branches:
      - remediation/verified-data-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'Chandan626k'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply surgical period qualification fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/market-engine.js')
          s = p.read_text()
          old_import = "import { fetchStatementEvidence, mergeStatementEvidence } from './statement-evidence.js';"
          new_import = "import { fetchStatementEvidence, mergeStatementEvidence, qualifyAnnualRows } from './statement-evidence.js';"
          old_fn = "function annualRows(rows) {\n  return (rows||[]).filter(r=>r && r.periodType!=='TTM' && (r.periodType==='12M' || r.requestedPeriod==='annual'));\n}"
          new_fn = "function annualRows(rows) {\n  return qualifyAnnualRows(rows);\n}"
          if old_import not in s or old_fn not in s:
              raise SystemExit('Expected market-engine period qualification source not found; refusing mutation')
          p.write_text(s.replace(old_import, new_import, 1).replace(old_fn, new_fn, 1))
          PY
          git diff --check
          grep -F "qualifyAnnualRows" lib/market-engine.js
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-period-fix.yml
          git add lib/market-engine.js
          git commit -m "fix(market-engine): require explicit annual period evidence"
          git push
