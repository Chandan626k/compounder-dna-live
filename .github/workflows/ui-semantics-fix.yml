name: UI Semantics Fix

on:
  push:
    branches:
      - remediation/verified-data-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'Chandan626k'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct live-data wording
        run: |
          python - <<'PY'
          from pathlib import Path

          terminal = Path('public/terminal.html')
          text = terminal.read_text()
          text = text.replace('Enter a symbol to load live market, fundamental and trading data.', 'Enter a symbol to load verified market, fundamental and trading data.')
          terminal.write_text(text)

          decision = Path('public/decision.html')
          text = decision.read_text()
          text = text.replace('● LIVE DATA', '● PROVIDER DATA')
          text = text.replace('<div class="label">Current price</div>', '<div class="label">Provider quote / latest price</div>')
          decision.write_text(text)
          PY
          git config user.name 'Chandan626k'
          git config user.email '153437308+Chandan626k@users.noreply.github.com'
          git add public/terminal.html public/decision.html
          git diff --cached --quiet || git commit -m 'fix: label provider quote and daily market data correctly'
          git push
          git rm .github/workflows/ui-semantics-fix.yml
          git commit -m 'chore: remove one-time UI patch workflow'
          git push
