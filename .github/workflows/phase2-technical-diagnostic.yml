name: Phase 2 Technical Diagnostic
on:
  push:
    branches:
      - remediation/verified-data-contract
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run canonical technical test with diagnostic log
        run: |
          set +e
          node tests/canonical-technical-engine.unit.mjs > /tmp/canonical.log 2>&1
          status=$?
          cat /tmp/canonical.log
          echo "exit=$status" >> /tmp/canonical.log
          exit $status
        continue-on-error: true
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: phase2-canonical-diagnostic
          path: /tmp/canonical.log
      - name: Fail if test failed
        run: |
          tail -n 1 /tmp/canonical.log | grep -q 'exit=0'
