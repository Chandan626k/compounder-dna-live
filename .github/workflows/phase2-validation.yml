name: Phase 2 Validation

on:
  push:
    branches:
      - phase2/frozen-phase1-integration
      - phase2/vertical-research-slice
      - phase2/evidence-timeline
      - phase2/stock-search-ux
      - phase2/data-foundation-identity-pit
      - phase2/data-foundation-canonical-adapter
      - phase2/data-foundation-financial-strength
      - phase2/recommendation-readiness
  pull_request:
    branches:
      - phase2/vertical-research-slice
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full test suite
        run: npm test
