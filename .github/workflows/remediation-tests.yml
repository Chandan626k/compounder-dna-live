name: Remediation Tests

on:
  push:
    branches:
      - remediation/verified-data-contract
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout actual repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve dependency lock with npm when required
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''] || {};
          const secure = lock.lockfileVersion === 3 && lock.version === pkg.version && root.version === pkg.version && root.engines?.node === pkg.engines?.node && lock.packages?.['node_modules/fast-uri']?.version === '3.1.7' && lock.packages?.['node_modules/qs']?.version === '6.16.0';
          fs.writeFileSync('/tmp/lock-secure', secure ? 'yes' : 'no');
          NODE
          if [ "$(cat /tmp/lock-secure)" != "yes" ]; then npm install --package-lock-only --ignore-scripts --no-audit; fi
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''] || {};
          if (lock.version !== pkg.version || root.version !== pkg.version || root.engines?.node !== pkg.engines?.node) throw new Error('Lock root metadata mismatch');
          if (lock.packages?.['node_modules/fast-uri']?.version !== '3.1.7') throw new Error('fast-uri lock version is not 3.1.7');
          if (lock.packages?.['node_modules/qs']?.version !== '6.16.0') throw new Error('qs lock version is not 6.16.0');
          NODE
      - name: Commit generated lockfile when resolver changed it
        run: |
          if git diff --quiet -- package-lock.json; then echo 'No package-lock.json changes to commit.'; else git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add package-lock.json; git commit -m 'chore: reconcile dependency lockfile'; git push origin HEAD:remediation/verified-data-contract; fi
      - name: Upload resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-resolved
          path: package-lock.json
          if-no-files-found: error
      - name: Install dependencies from committed/resolved lock
        run: npm ci
      - name: Dependency vulnerability diagnostic
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs = require('fs'); const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8')); console.log(JSON.stringify(audit.metadata?.vulnerabilities || {}, null, 2));
          NODE
          npm ls fast-uri qs @modelcontextprotocol/sdk --all
      - name: Yahoo annual provider metadata probe
        run: |
          node --input-type=module - <<'NODE'
          import YahooFinance from 'yahoo-finance2';
          const yf = new YahooFinance({ suppressNotices: ['yahooSurvey'] });
          const rows = await yf.fundamentalsTimeSeries('RELIANCE.NS', { period1: new Date(Date.now() - 3 * 365.25 * 86400000), period2: new Date(), type: 'annual', module: 'financials' }, { validateResult: false });
          const annual = (Array.isArray(rows) ? rows : []).filter(r => String(r?.periodType || '').toUpperCase() === '12M');
          if (!annual.length) throw new Error('No annual 12M fundamentalsTimeSeries rows returned');
          const row = annual.at(-1); console.log(JSON.stringify({ date: row?.date ?? null, periodType: row?.periodType ?? null, issuer: row?.issuer ?? null, reportingPeriod: row?.reportingPeriod ?? null, statementScope: row?.statementScope ?? null, unit: row?.unit ?? null, currency: row?.currency ?? null, ticker: row?.ticker ?? null }, null, 2));
          NODE
      - name: Production syntax checks
        run: |
          for f in server.js api/actionability.js api/analyze.js api/data.js api/data-foundation.js api/investment-readiness.js api/scan.js api/trading.js lib/market-data-provider.js lib/verified-analysis.js lib/canonical-technical-engine.js lib/technical-compatibility-adapter.js lib/scanner-engine-v2.js lib/statement-evidence.js lib/financial-metric-lineage.js tests/canonical-technical-engine.unit.mjs tests/technical-compatibility-adapter.unit.mjs tests/market-data-integrity.unit.mjs tests/verified-consumer-audit.unit.mjs tests/financial-metric-lineage.unit.mjs tests/financial-metric-lineage-builder.unit.mjs tests/statement-period-lineage.unit.mjs; do node --check "$f" || exit 1; done
      - name: Core provenance/data-contract tests
        run: |
          node tests/validation-gate.unit.mjs
          node tests/canonical-technical-engine.unit.mjs
          node tests/technical-compatibility-adapter.unit.mjs
          node tests/statement-evidence.unit.mjs
          node tests/statement-period-qualification.unit.mjs
          node tests/market-engine-period-qualification.unit.mjs
          node tests/financial-evidence.unit.mjs
          node tests/bank-ir-evidence.unit.mjs
          node tests/investment-readiness.unit.mjs
          node tests/verified-statement-failure.integration.mjs
          node tests/verified-data-contract.unit.mjs
          node tests/market-data-integrity.unit.mjs
          node tests/verified-consumer-audit.unit.mjs
          node tests/financial-metric-lineage.unit.mjs
          node tests/financial-metric-lineage-builder.unit.mjs
          node tests/statement-period-lineage.unit.mjs
      - name: Known bank PDF qualification test
        continue-on-error: true
        run: node tests/bank-ir-pdf-qualification.unit.mjs
      - name: Directly affected strategy/data tests
        if: ${{ always() }}
        run: node tests/market-engine.unit.mjs && node tests/sector-framework.unit.mjs && node tests/decision-evidence-gate.unit.mjs && node tests/actionability.unit.mjs
