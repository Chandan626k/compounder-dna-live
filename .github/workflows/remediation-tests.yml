name: Remediation Tests

# Runs the current remediation branch so targeted evidence regressions cannot be hidden by an earlier known failure.
on:
  push:
    branches:
      - remediation/verified-data-contract
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout actual repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency vulnerability diagnostic
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          console.log('audit metadata:', JSON.stringify(audit.metadata?.vulnerabilities || {}, null, 2));
          for (const [name, v] of Object.entries(audit.vulnerabilities || {})) {
            console.log(JSON.stringify({name, severity:v.severity, range:v.range, fixAvailable:v.fixAvailable, via:v.via}, null, 2));
          }
          NODE
          npm ls fast-uri qs @modelcontextprotocol/sdk --all || true
      - name: Generate dependency lock candidate
        run: |
          cp package-lock.json /tmp/package-lock.before.json
          npm install --package-lock-only --ignore-scripts --no-audit
          if cmp -s package-lock.json /tmp/package-lock.before.json; then
            echo 'LOCK_CANDIDATE_CHANGED=false' >> "$GITHUB_ENV"
            echo 'package-lock.json is unchanged after network-enabled npm resolution.'
          else
            echo 'LOCK_CANDIDATE_CHANGED=true' >> "$GITHUB_ENV"
            echo 'package-lock.json changes produced by npm resolver:'
            git diff -- package-lock.json
          fi
      - name: Upload dependency lock candidate
        if: ${{ env.LOCK_CANDIDATE_CHANGED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-candidate
          path: package-lock.json
          if-no-files-found: error
      - name: Yahoo annual provider metadata probe
        run: |
          node --input-type=module - <<'NODE'
          import YahooFinance from 'yahoo-finance2';
          const yf = new YahooFinance({ suppressNotices: ['yahooSurvey'] });
          const ticker = 'RELIANCE.NS';
          const period2 = new Date();
          const period1 = new Date(Date.now() - 3 * 365.25 * 86400000);
          const rows = await yf.fundamentalsTimeSeries(ticker, {
            period1, period2, type: 'annual', module: 'financials'
          }, { validateResult: false });
          console.log('provider row count:', Array.isArray(rows) ? rows.length : 0);
          const annual = (Array.isArray(rows) ? rows : []).filter(r => String(r?.periodType || '').toUpperCase() === '12M');
          if (!annual.length) throw new Error('No annual 12M fundamentalsTimeSeries rows returned for metadata probe');
          const row = annual.at(-1);
          console.log('annual row keys:', Object.keys(row).sort());
          console.log('identity metadata:', JSON.stringify({
            date: row?.date ?? null,
            periodType: row?.periodType ?? null,
            reportingPeriod: row?.reportingPeriod ?? null,
            issuer: row?.issuer ?? null,
            companyName: row?.companyName ?? null,
            statementScope: row?.statementScope ?? null,
            scope: row?.scope ?? null,
            unit: row?.unit ?? null,
            units: row?.units ?? null,
            currency: row?.currency ?? null,
            symbol: row?.symbol ?? null,
            ticker: row?.ticker ?? null
          }, null, 2));
          console.log('sample annual observation:', JSON.stringify(row, null, 2));
          NODE
      - name: Production syntax checks
        run: |
          node --check server.js
          node --check api/actionability.js
          node --check api/analyze.js
          node --check api/data.js
          node --check api/data-foundation.js
          node --check api/investment-readiness.js
          node --check api/scan.js
          node --check api/trading.js
          node --check lib/market-data-provider.js
          node --check lib/verified-analysis.js
          node --check lib/scanner-engine-v2.js
          node --check lib/statement-evidence.js
          node --check lib/financial-metric-lineage.js
          node --check tests/market-data-integrity.unit.mjs
          node --check tests/verified-consumer-audit.unit.mjs
          node --check tests/financial-metric-lineage.unit.mjs
          node --check tests/financial-metric-lineage-builder.unit.mjs
          node --check tests/statement-period-lineage.unit.mjs
      - name: Core provenance/data-contract tests
        run: |
          node tests/validation-gate.unit.mjs
          node tests/statement-evidence.unit.mjs
          node tests/statement-period-qualification.unit.mjs
          node tests/market-engine-period-qualification.unit.mjs
          node tests/financial-evidence.unit.mjs
          node tests/bank-ir-evidence.unit.mjs
          node tests/investment-readiness.unit.mjs
          node tests/verified-statement-failure.integration.mjs
          node tests/verified-data-contract.unit.mjs
          node tests/market-data-integrity.unit.mjs
          node tests/verified-consumer-audit.unit.mjs
          node tests/financial-metric-lineage.unit.mjs
          node tests/financial-metric-lineage-builder.unit.mjs
          node tests/statement-period-lineage.unit.mjs
      - name: Known bank PDF qualification test
        continue-on-error: true
        run: node tests/bank-ir-pdf-qualification.unit.mjs
      - name: Directly affected strategy/data tests
        if: ${{ always() }}
        run: |
          node tests/market-engine.unit.mjs
          node tests/sector-framework.unit.mjs
          node tests/decision-evidence-gate.unit.mjs
